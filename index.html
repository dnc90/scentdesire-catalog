<head>
<meta charset="UTF-8">

<title>ScentDesire — Katalog ofert</title>
<meta name="description" content="Katalog ofert ScentDesire. Testery perfum, produkty sklepowe i kosmetyki. Zamówienia przez e-mail.">

<style>
:root {
  --bg: #0b0a09;
  --panel: #12100e;
  --gold: #e7bd70;
  --gold-light: #f8dfaa;
  --text: #f7f2e9;
  --muted: #bdb4a5;
  --border: rgba(231,189,112,.45);
}

* { box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, Helvetica, sans-serif;
  line-height: 1.5;
}

a { color: inherit; }

.email-bar {
  min-height: 54px;
  padding: 14px 5%;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
}

.email-link {
  color: var(--gold-light);
  text-decoration: none;
  font-size: 14px;
  overflow-wrap: anywhere;
}

.email-link:hover { text-decoration: underline; }

.brand {
  min-height: 255px;
  padding: 45px 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  position: relative;
  overflow: hidden;
  border-bottom: 1px solid var(--border);
  background:
    radial-gradient(ellipse at 50% 50%,
      rgba(155,105,39,.18), transparent 62%),
    linear-gradient(145deg, #100e0b, #080807);
}

.brand::before,
.brand::after {
  content: "";
  position: absolute;
  width: 180px;
  height: 180px;
  border: 1px solid rgba(231,189,112,.12);
  border-radius: 50%;
}

.brand::before { left: -120px; top: 35px; }
.brand::after { right: -120px; bottom: 5px; }

.brand-content { position: relative; z-index: 1; }

.brand-mark {
  color: var(--gold);
  font-size: 28px;
  line-height: 1;
  margin-bottom: 9px;
}

.brand h1 {
  margin: 0;
  color: var(--gold-light);
  font-family: Georgia, "Times New Roman", serif;
  font-size: clamp(42px, 9vw, 76px);
  font-weight: 400;
  letter-spacing: -2px;
}

.brand h1 span {
  font-style: italic;
  font-weight: 400;
}

main {
  width: min(1120px, 100%);
  margin: 0 auto;
  padding: 48px 24px 56px;
}

.categories {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 22px;
}

.category {
  min-height: 205px;
  padding: 28px 12px 23px;
  background: linear-gradient(155deg, #17130f, #0d0c0a);
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--text);
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  text-align: center;
  transition: border-color .2s, background .2s,
              transform .2s;
}

.category:hover,
.category:focus-visible {
  border-color: var(--gold-light);
  background: #1c1710;
  transform: translateY(-3px);
  outline: none;
}

.category-icon {
  width: 48px;
  height: 48px;
  color: var(--gold);
}

.category-name {
  font-family: Georgia, "Times New Roman", serif;
  font-size: clamp(19px, 2.5vw, 25px);
}

.category-arrow {
  color: var(--gold);
  font-size: 24px;
  line-height: 1;
}

.catalog {
  display: none;
  margin-top: 36px;
  padding: 26px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--panel);
}

.catalog.active { display: block; }

.catalog-heading {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
  border-bottom: 1px solid var(--border);
  padding-bottom: 18px;
}

.catalog h2 {
  margin: 0;
  color: var(--gold-light);
  font: 400 28px Georgia, "Times New Roman", serif;
}

.back-button {
  padding: 9px 14px;
  background: transparent;
  color: var(--gold-light);
  border: 1px solid var(--border);
  border-radius: 30px;
  cursor: pointer;
}

.back-button:hover { background: #282016; }

.product-list {
  list-style: none;
  padding: 0;
  margin: 18px 0;
}

.product-list li {
  padding: 13px 4px;
  border-bottom: 1px solid rgba(231,189,112,.15);
  overflow-wrap: anywhere;
}

.empty-message {
  color: var(--muted);
  padding: 20px 0 10px;
}

.catalog-email {
  margin-top: 24px;
  padding-top: 18px;
  border-top: 1px solid var(--border);
  overflow-wrap: anywhere;
}

footer {
  text-align: center;
  padding: 36px 20px 42px;
  border-top: 1px solid var(--border);
  background:
    radial-gradient(ellipse at 50% 100%,
      rgba(155,105,39,.12), transparent 65%),
    #0d0b09;
}

footer p {
  margin: 0 0 14px;
  font-family: Georgia, "Times New Roman", serif;
  font-size: 20px;
}

footer .email-link {
  font-size: 15px;
  font-weight: 600;
}

@media (max-width: 680px) {
  main { padding: 30px 16px 38px; }

  .categories {
    grid-template-columns: 1fr;
    gap: 14px;
  }

  .category {
    min-height: 145px;
    padding: 20px 12px;
    gap: 10px;
  }

  .brand { min-height: 215px; }

  .catalog { padding: 19px 15px; }

  .catalog h2 { font-size: 24px; }
}

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { transition: none !important; }
}
</style>
</head>

const titles = {
  testery: "Testery perfum",
  sklepowe: "Produkty sklepowe",
  kosmetyki: "Kosmetyki"
};

const categories = document.getElementById("categories");
const catalog = document.getElementById("catalog");
const catalogTitle = document.getElementById("catalog-title");
const productList = document.getElementById("product-list");
const backButton = document.getElementById("back-button");

function openCatalog(category) {
  catalogTitle.textContent = titles[category];
  productList.replaceChildren();

  const products = offers[category] || [];

  if (products.length === 0) {
    const message = document.createElement("li");
    message.className = "empty-message";
    message.textContent =
      "Zapytaj o aktualną listę dostępnych produktów, kontaktując się z nami przez e-mail.";
    productList.appendChild(message);
  } else {
    products.forEach(function(product) {
      const item = document.createElement("li");
      item.textContent = product;
      productList.appendChild(item);
    });
  }

  catalog.classList.add("active");
  categories.hidden = true;
  catalog.scrollIntoView({ behavior: "smooth", block: "start" });
}

document.querySelectorAll("[data-category]").forEach(function(button) {
  button.addEventListener("click", function() {
    openCatalog(button.dataset.category);
  });
});

backButton.addEventListener("click", function() {
  catalog.classList.remove("active");
  categories.hidden = false;
  categories.scrollIntoView({ behavior: "smooth", block: "start" });
});
